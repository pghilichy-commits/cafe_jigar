<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f4efe8;
    color:#29231f;
    font-family:
        Tahoma,
        Arial,
        sans-serif;
}

.container{
    width:min(1100px,94%);
    margin:25px auto;
}

.card{
    background:#fff;
    border-radius:20px;
    padding:24px;
    margin-bottom:20px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.login{
    max-width:450px;
    margin:80px auto;
}

.hidden{
    display:none !important;
}

h1{
    margin-top:0;
}

h2{
    margin-top:0;
}

label{
    display:block;
    margin-top:10px;
    margin-bottom:5px;
    font-weight:bold;
}

input,
textarea,
select{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    font-family:inherit;
    font-size:15px;
    background:#fff;
}

textarea{
    min-height:100px;
    resize:vertical;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 20px;
    cursor:pointer;
    font-family:inherit;
    font-size:15px;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.primary{
    background:#29231f;
    color:white;
}

.success{
    background:#16803c;
    color:white;
}

.danger{
    background:#b42318;
    color:white;
}

.gray{
    background:#e8e0d7;
    color:#29231f;
}

.full{
    width:100%;
}

.status{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    line-height:1.8;
}

.status.show{
    display:block;
    background:#fff4df;
}

.status.error{
    display:block;
    background:#ffe8e8;
    color:#a00000;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:20px;
}

.tab{
    background:#e8e0d7;
}

.tab.active{
    background:#29231f;
    color:white;
}

.panel{
    display:none;
}

.panel.active{
    display:block;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.item{
    border:1px solid #e4ddd5;
    border-radius:14px;
    padding:15px;
    margin-top:12px;
}

.item-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.item-info{
    line-height:1.9;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

hr{
    border:0;
    border-top:1px solid #eee;
    margin:25px 0;
}

.small{
    color:#777;
    font-size:13px;
}

@media(max-width:700px){

    .grid{
        grid-template-columns:1fr;
    }

    .topbar{
        flex-direction:column;
        align-items:flex-start;
    }

    .item-row{
        flex-direction:column;
        align-items:flex-start;
    }

}

</style>
</head>

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>



<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
"https://aivrpevlkpbpzcjskhnj.supabase.co";


const SUPABASE_KEY =
"sb_publishable_HN7v3kDhxrQYP1Ru0EJixw_XS_K0cxE";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



/* =====================================================
   GLOBAL
===================================================== */

let siteData = {};

let categoriesData = [];



/* =====================================================
   HELPER
===================================================== */

function get(id){

    return document.getElementById(id);

}



function showLoginMessage(
    text,
    error = false
){

    const box =
        get("loginStatus");

    box.innerText =
        text;

    box.className =
        error
        ? "status error"
        : "status show";

}



/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const email =
        get("email")
        .value
        .trim();


    const password =
        get("password")
        .value;


    if(!email){

        showLoginMessage(
            "ایمیل را وارد کنید.",
            true
        );

        return;

    }


    if(!password){

        showLoginMessage(
            "رمز عبور را وارد کنید.",
            true
        );

        return;

    }


    const button =
        get("loginButton");


    button.disabled =
        true;


    button.innerText =
        "در حال ورود...";


    showLoginMessage(
        "در حال اتصال به سرور..."
    );


    try{

        const result =
            await supabaseClient
            .auth
            .signInWithPassword({

                email:
                    email,

                password:
                    password

            });


        if(result.error){

            throw result.error;

        }


        get("loginPage")
        .classList
        .add("hidden");


        get("adminPage")
        .classList
        .remove("hidden");


        get("userEmail")
        .innerText =
            result.data.user.email;


        await loadEverything();


    }catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        showLoginMessage(
            "خطا در ورود: " +
            error.message,
            true
        );

    }


    button.disabled =
        false;


    button.innerText =
        "ورود به پنل";

}



/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await supabaseClient
        .auth
        .signOut();


    location.reload();

}



/* =====================================================
   SESSION CHECK
===================================================== */

async function checkSession(){

    try{

        const result =
            await supabaseClient
            .auth
            .getSession();


        if(
            result.data &&
            result.data.session
        ){

            const user =
                result.data
                .session
                .user;


            get("loginPage")
            .classList
            .add("hidden");


            get("adminPage")
            .classList
            .remove("hidden");


            get("userEmail")
            .innerText =
                user.email;


            await loadEverything();

        }

    }catch(error){

        console.error(
            "SESSION ERROR:",
            error
        );

    }

}



/* =====================================================
   TABS
===================================================== */

function openTab(
    id,
    button
){

    document
    .querySelectorAll(
        ".panel"
    )
    .forEach(
        panel =>
            panel
            .classList
            .remove("active")
    );


    document
    .querySelectorAll(
        ".tab"
    )
    .forEach(
        tab =>
            tab
            .classList
            .remove("active")
    );


    get(id)
    .classList
    .add("active");


    button
    .classList
    .add("active");

}



/* =====================================================
   LOAD SETTINGS
===================================================== */

async function loadSettings(){

    const result =
        await supabaseClient
        .from("site_settings")
        .select("*")
        .eq("id","main")
        .maybeSingle();


    if(result.error){

        throw result.error;

    }


    siteData =
        result.data &&
        result.data.data
        ? result.data.data
        : {};


    get("siteName")
        .value =
        siteData.siteName ||
        siteData.name ||
        "کافه جیگر";


    get("siteDescription")
        .value =
        siteData.siteDescription ||
        siteData.description ||
        "";


    get("sitePhone")
        .value =
        siteData.phone ||
        "";


    get("siteAddress")
        .value =
        siteData.address ||
        "";


    get("instagram")
        .value =
        siteData.instagram ||
        "";


    get("globalDiscount")
        .value =
        siteData.globalDiscount ||
        0;

}



/* =====================================================
   SAVE SETTINGS
===================================================== */

async function saveSettings(){

    const newData = {

        ...siteData,

        siteName:
            get("siteName")
            .value,

        siteDescription:
            get("siteDescription")
            .value,

        phone:
            get("sitePhone")
            .value,

        address:
            get("siteAddress")
            .value,

        instagram:
            get("instagram")
            .value

    };


    const result =
        await supabaseClient
        .from("site_settings")
        .upsert({

            id:
                "main",

            data:
                newData,

            updated_at:
                new Date()
                .toISOString()

        });


    if(result.error){

        alert(
            "خطا در ذخیره:\n" +
            result.error.message
        );

        return;

    }


    siteData =
        newData;


    alert(
        "تنظیمات با موفقیت ذخیره شد."
    );

}



/* =====================================================
   LOAD CATEGORIES
===================================================== */

async function loadCategories(){

    const result =
        await supabaseClient
        .from("categories")
        .select("*")
        .order(
            "sort_order",
            {
                ascending:true
            }
        );


    if(result.error){

        throw result.error;

    }


    categoriesData =
        result.data || [];


    const list =
        get("categoriesList");


    list.innerHTML =
        "";


    categoriesData
    .forEach(
        category => {

            const item =
                document
                .createElement("div");


            item.className =
                "item";


            item.innerHTML = `

                <div class="item-row">

                    <div class="item-info">

                        <strong>
                            ${escapeHtml(category.name)}
                        </strong>

                        <br>

                        <span class="small">
                            شناسه:
                            ${escapeHtml(category.id)}
                        </span>

                    </div>


                    <button
                        class="danger"
                        onclick="deleteCategory('${escapeJs(category.id)}')"
                    >
                        حذف
                    </button>

                </div>

            `;


            list.appendChild(
                item
            );

        }
    );


    const select =
        get("productCategory");


    select.innerHTML =
        "";


    categoriesData
    .filter(
        category =>
            category.active !== false
    )
    .forEach(
        category => {

            const option =
                document
                .createElement("option");


            option.value =
                category.id;


            option.textContent =
                category.name;


            select.appendChild(
                option
            );

        }
    );

}



/* =====================================================
   ADD CATEGORY
===================================================== */

async function addCategory(){

    const name =
        get("newCategory")
        .value
        .trim();


    if(!name){

        alert(
            "نام دسته‌بندی را وارد کنید."
        );

        return;

    }


    const id =
        "cat_" +
        Date.now();


    const result =
        await supabaseClient
        .from("categories")
        .insert({

            id:
                id,

            name:
                name,

            sort_order:
                100,

            active:
                true

        });


    if(result.error){

        alert(
            "خطا:\n" +
            result.error.message
        );

        return;

    }


    get("newCategory")
        .value =
        "";


    await loadCategories();


    alert(
        "دسته‌بندی اضافه شد."
    );

}



/* =====================================================
   DELETE CATEGORY
===================================================== */

async function deleteCategory(id){

    if(
        !confirm(
            "آیا از حذف این دسته‌بندی مطمئن هستید؟"
        )
    ){

        return;

    }


    const result =
        await supabaseClient
        .from("categories")
        .delete()
        .eq(
            "id",
            id
        );


    if(result.error){

        alert(
            "خطا:\n" +
            result.error.message
        );

        return;

    }


    await loadCategories();

    await loadProducts();


    alert(
        "دسته‌بندی حذف شد."
    );

}



/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

    const result =
        await supabaseClient
        .from("products")
        .select("*")
        .order(
            "sort_order",
            {
                ascending:true
            }
        );


    if(result.error){

        throw result.error;

    }


    const products =
        result.data || [];


    const list =
        get("productsList");


    list.innerHTML =
        "";


    if(products.length === 0){

        list.innerHTML =
            "<p>هنوز محصولی ثبت نشده است.</p>";

        return;

    }


    products
    .forEach(
        product => {

            const item =
                document
                .createElement("div");


            item.className =
                "item";


            const price =
                Number(
                    product.price || 0
                )
                .toLocaleString(
                    "fa-IR"
                );


            const oldPrice =
                Number(
                    product.old_price || 0
                )
                .toLocaleString(
                    "fa-IR"
                );


            item.innerHTML = `

                <div class="item-row">

                    <div class="item-info">

                        <strong>
                            ${escapeHtml(product.name)}
                        </strong>

                        <br>

                        قیمت:
                        ${price}
                        تومان

                        ${
                            product.old_price
                            ?
                            `
                            <br>
                            قیمت قبلی:
                            ${oldPrice}
                            تومان
                            `
                            :
                            ""
                        }

                        ${
                            product.discount
                            ?
                            `
                            <br>
                            تخفیف:
                            ${product.discount}٪
                            `
                            :
                            ""
                        }

                        <br>

                        <span class="small">

                            ${
                                escapeHtml(
                                    product.description ||
                                    ""
                                )
                            }

                        </span>

                    </div>


                    <div class="actions">

                        <button
                            class="danger"
                            onclick="deleteProduct(${product.id})"
                        >
                            حذف
                        </button>

                    </div>

                </div>

            `;


            list.appendChild(
                item
            );

        }
    );

}



/* =====================================================
   ADD PRODUCT
===================================================== */

async function addProduct(){

    const name =
        get("productName")
        .value
        .trim();


    if(!name){

        alert(
            "نام محصول را وارد کنید."
        );

        return;

    }


    const category =
        get("productCategory")
        .value;


    if(!category){

        alert(
            "دسته‌بندی را انتخاب کنید."
        );

        return;

    }


    const product = {

        name:
            name,

        cat:
            category,

        description:
            get("productDescription")
            .value,

        price:
            Number(
                get("productPrice")
                .value || 0
            ),

        old_price:
            Number(
                get("productOldPrice")
                .value || 0
            ),

        discount:
            Number(
                get("productDiscount")
                .value || 0
            ),

        image_url:
            get("productImage")
            .value,

        featured:
            false,

        available:
            true,

        sort_order:
            100

    };


    const result =
        await supabaseClient
        .from("products")
        .insert(
            product
        );


    if(result.error){

        alert(
            "خطا در افزودن محصول:\n" +
            result.error.message
        );

        return;

    }


    get("productName")
        .value = "";

    get("productDescription")
        .value = "";

    get("productPrice")
        .value = "";

    get("productOldPrice")
        .value = "";

    get("productDiscount")
        .value = "";

    get("productImage")
        .value = "";


    await loadProducts();


    alert(
        "محصول با موفقیت اضافه شد."
    );

}



/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(id){

    if(
        !confirm(
            "آیا از حذف این محصول مطمئن هستید؟"
        )
    ){

        return;

    }


    const result =
        await supabaseClient
        .from("products")
        .delete()
        .eq(
            "id",
            id
        );


    if(result.error){

        alert(
            "خطا:\n" +
            result.error.message
        );

        return;

    }


    await loadProducts();


    alert(
        "محصول حذف شد."
    );

}



/* =====================================================
   SAVE DISCOUNT
===================================================== */

async function saveDiscount(){

    let value =
        Number(
            get("globalDiscount")
            .value || 0
        );


    if(value < 0)
        value = 0;


    if(value > 100)
        value = 100;


    const newData = {

        ...siteData,

        globalDiscount:
            value

    };


    const result =
        await supabaseClient
        .from("site_settings")
        .upsert({

            id:
                "main",

            data:
                newData,

            updated_at:
                new Date()
                .toISOString()

        });


    if(result.error){

        alert(
            "خطا:\n" +
            result.error.message
        );

        return;

    }


    siteData =
        newData;


    alert(
        "تخفیف ذخیره شد."
    );

}



/* =====================================================
   LOAD EVERYTHING
===================================================== */

async function loadEverything(){

    try{

        await loadSettings();

        await loadCategories();

        await loadProducts();

    }catch(error){

        console.error(
            "LOAD ERROR:",
            error
        );


        alert(

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


function escapeJs(value){

    return String(
        value ?? ""
    )
    .replaceAll(
        "\\",
        "\\\\"
    )
    .replaceAll(
        "'",
        "\\'"
    );

}
