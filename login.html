<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورود مدیریت کافه جیگر</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#090909;
  color:#fff;
  font-family:Tahoma,Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:640px;
  background:#151515;
  border:1px solid #303030;
  border-radius:30px;
  padding:42px;
  box-shadow:0 25px 80px rgba(0,0,0,.55);
}

.logo{
  width:140px;
  height:140px;
  border-radius:35px;
  background:#d6a85b;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 28px;
  font-size:70px;
  font-weight:bold;
}

h1{
  text-align:center;
  margin:0 0 10px;
  font-size:34px;
}

.sub{
  text-align:center;
  color:#999;
  margin-bottom:35px;
  font-size:18px;
}

label{
  display:block;
  margin:20px 0 9px;
  color:#ddd;
  font-size:17px;
}

input{
  width:100%;
  padding:20px;
  border-radius:18px;
  border:1px solid #3b3b3b;
  background:#222;
  color:#fff;
  font-size:18px;
  outline:none;
}

input:focus{
  border-color:#d6a85b;
}

button{
  width:100%;
  margin-top:28px;
  padding:21px;
  border:0;
  border-radius:18px;
  background:#d6a85b;
  color:#111;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:wait;
}

#msg{
  margin-top:20px;
  padding:15px;
  border-radius:14px;
  text-align:center;
  display:none;
  line-height:1.8;
}

.success{
  display:block !important;
  background:#123b25;
  color:#79e0a1;
}

.error{
  display:block !important;
  background:#401818;
  color:#ff8e8e;
}

.footer{
  text-align:center;
  color:#555;
  margin-top:30px;
  font-size:14px;
}

@media(max-width:600px){
  .box{
    padding:30px 22px;
  }

  .logo{
    width:120px;
    height:120px;
    font-size:60px;
  }

  h1{
    font-size:28px;
  }
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">ج</div>

  <h1>مدیریت کافه جیگر</h1>

  <div class="sub">
    ورود به پنل مدیریت آنلاین
  </div>

  <label>ایمیل</label>
  <input
    id="email"
    type="email"
    value="pghilichy@gmail.com"
    autocomplete="username"
  >

  <label>رمز عبور</label>
  <input
    id="password"
    type="password"
    value="09900990"
    autocomplete="current-password"
  >

  <button id="loginBtn" onclick="login()">
    ورود به پنل
  </button>

  <div id="msg"></div>

  <div class="footer">
    CAFE JIGAR • ONLINE CMS
  </div>

</div>

<script>

const SUPABASE_URL =
"https://aivrpevlkpbpzcjskhnj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_HN7v3kDhxrQYP1Ru0EJixw_XS_K0cxE";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

const PANEL_URL =
"https://pghilichy-commits.github.io/cafe_jigar/admin.html";

function showMessage(text,type){

  const msg=document.getElementById("msg");

  msg.textContent=text;

  msg.className=type;

}

async function login(){

  const email=
    document.getElementById("email").value.trim();

  const password=
    document.getElementById("password").value;

  const btn=
    document.getElementById("loginBtn");

  if(!email || !password){

    showMessage(
      "ایمیل و رمز عبور را وارد کنید.",
      "error"
    );

    return;
  }

  btn.disabled=true;

  btn.textContent="در حال ورود...";

  showMessage(
    "در حال اتصال به پنل مدیریت...",
    "success"
  );

  try{

    const {data,error} =
      await supabaseClient.auth.signInWithPassword({
        email:email,
        password:password
      });

    if(error){

      console.error(error);

      showMessage(
        "ورود ناموفق بود: " + error.message,
        "error"
      );

      btn.disabled=false;

      btn.textContent="ورود به پنل";

      return;
    }

    if(!data || !data.session){

      showMessage(
        "ورود انجام شد ولی نشست کاربری ایجاد نشد.",
        "error"
      );

      btn.disabled=false;

      btn.textContent="ورود به پنل";

      return;
    }

    showMessage(
      "ورود موفق شد! در حال باز کردن پنل...",
      "success"
    );

    /*
      کمی صبر می‌کنیم تا نشست در مرورگر ذخیره شود،
      سپس مستقیماً پنل را باز می‌کنیم.
    */

    setTimeout(function(){

      window.location.href =
        PANEL_URL + "?v=" + Date.now();

    },700);

  }catch(err){

    console.error(err);

    showMessage(
      "خطای غیرمنتظره: " + err.message,
      "error"
    );

    btn.disabled=false;

    btn.textContent="ورود به پنل";
  }
}

document
  .getElementById("password")
  .addEventListener("keydown",function(e){

    if(e.key==="Enter"){
      login();
    }

  });

</script>

</body>
</html>
